<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Dokter · Rumah Sakit Bethesda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-brand">
      <img src="../Asset/logo_bethesda.png" alt="Logo Rumah Sakit Bethesda" class="login-logo">
      <div class="name">Rumah Sakit Bethesda</div>
      <div class="sub">Login dokter</div>
    </div>

    <p class="pesan-error" id="pesanError" style="display:none;"></p>

    <form id="formLogin">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn-primary">Masuk</button>
    </form>
  </div>

  <script src="login.js"></script>
</body>
</html>
