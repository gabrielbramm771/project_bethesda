<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Rawat Jalan - RS Bethesda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4 flex items-start justify-center">

  <div class="max-w-3xl w-full bg-white rounded-3xl shadow-2xl border border-slate-200/80 overflow-hidden">

    <!-- Header Banner -->
    <div class="bg-gradient-to-r from-blue-700 via-indigo-600 to-blue-800 p-6 text-white text-center relative overflow-hidden">
      <div class="absolute -right-6 -top-6 w-24 h-24 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
      <div class="absolute -left-6 -bottom-6 w-24 h-24 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
      <div class="inline-flex items-center justify-center w-16 h-16 bg-white p-2 rounded-2xl mb-3 shadow-md">
        <img src="../Asset/OIP.jpg" alt="Logo RS Bethesda" class="w-full h-full object-contain">
      </div>
      <h1 class="text-2xl font-bold tracking-tight">RS BETHESDA YOGYAKARTA</h1>
      <p class="text-xs text-blue-100 mt-1 font-medium">Pendaftaran Pasien Rawat Jalan (Lama / Baru)</p>
    </div>

    <div id="formWrapper">
      <div class="p-8 text-center text-slate-400 text-sm">Memuat...</div>
    </div>

    <!-- Template form; bagian isian dirender oleh pendaftaran.js -->
    <template id="templateForm">
      <form id="formDaftar" action="../Backend/proses_pendaftaran.php" method="POST" class="p-6 md:p-8 space-y-8">
        <div id="pesanError" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm font-semibold rounded-xl px-4 py-3"></div>

        <input type="hidden" id="id_dokter" name="id_dokter">
        <input type="hidden" id="kode_klinik" name="kode_klinik">

        <!-- Pasien lama / baru -->
        <div class="flex gap-2">
          <label class="flex-1 cursor-pointer">
            <input type="radio" name="tipe_pasien" value="lama" class="peer sr-only" checked>
            <span class="block text-center px-3 py-3 rounded-xl border border-slate-300 bg-slate-50 text-sm font-semibold text-slate-600 transition-all peer-checked:bg-blue-600 peer-checked:border-blue-600 peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-blue-600 peer-focus-visible:ring-offset-2">Pasien Lama</span>
          </label>
          <label class="flex-1 cursor-pointer">
            <input type="radio" name="tipe_pasien" value="baru" class="peer sr-only">
            <span class="block text-center px-3 py-3 rounded-xl border border-slate-300 bg-slate-50 text-sm font-semibold text-slate-600 transition-all peer-checked:bg-blue-600 peer-checked:border-blue-600 peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-blue-600 peer-focus-visible:ring-offset-2">Pasien Baru</span>
          </label>
        </div>

        <div id="sections" class="space-y-8"></div>

        <button type="submit"
          class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-blue-600/25 transition-all transform active:scale-[0.99] flex items-center justify-center gap-2">
          <span>Konfirmasi &amp; Daftar</span>
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
      </form>
    </template>

    <template id="templateBelumPilih">
      <div class="p-8 text-center space-y-4">
        <p class="text-slate-500 text-sm">Silakan pilih klinik dan dokter terlebih dahulu sebelum mendaftar.</p>
        <a href="pilih_klinik.html" class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-xl transition-all active:scale-95">Pilih Klinik</a>
      </div>
    </template>
  </div>

  <datalist id="dlProvinsi"></datalist>
  <script src="pendaftaran.js"></script>
</body>
</html>
