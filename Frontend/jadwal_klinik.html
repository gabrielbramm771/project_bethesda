<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilih Dokter · RS Bethesda Yogyakarta</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <header class="bg-white border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-5 h-16 flex items-center justify-between">
      <a href="beranda.html" class="flex items-center gap-2.5">
        <img src="../Asset/OIP.jpg" alt="Logo RS Bethesda" class="w-9 h-9 object-contain">
        <span class="font-bold text-slate-900 text-sm">RS Bethesda Yogyakarta</span>
      </a>
      <a href="login.html" class="text-sm font-semibold text-slate-500 hover:text-blue-700">Login Dokter</a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-5 py-14">
    <a href="pilih_klinik.html" class="text-sm font-semibold text-blue-600 hover:text-blue-700">&larr; Ganti klinik</a>

    <div class="flex items-center gap-2 text-xs font-semibold text-slate-400 mt-4 mb-3">
      <span class="text-blue-600">1. Pilih Klinik</span>
      <span class="text-slate-300">&rarr;</span>
      <span class="flex items-center gap-2 text-blue-600">
        <span class="bg-blue-600 text-white w-5 h-5 rounded-full flex items-center justify-center">2</span>
        Pilih Dokter
      </span>
      <span class="text-slate-300">&rarr;</span>
      <span>3. Daftar</span>
    </div>

    <h1 id="judulKlinik" class="text-2xl md:text-3xl font-extrabold text-slate-900">Memuat...</h1>
    <p class="mt-2 text-slate-500">Pilih dokter sesuai jadwal praktek yang cocok untuk Anda.</p>

    <div id="dokterContainer" class="mt-10 space-y-4">
      <p class="text-slate-400 text-sm">Memuat data dokter...</p>
    </div>
  </main>

  <script src="jadwal_klinik.js"></script>
</body>
</html>
